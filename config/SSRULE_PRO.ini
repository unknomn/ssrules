;设置规则标志位

;设置分组标志位
;分层设计（2026-07-20）：
;  · 区域组：url-test 按节点名正则自动归类、组内选最快 —— 新增节点按命名自动归位
;  · 场景组：select 全菜单（所有区域组 + 自动/手动/具体节点/DIRECT 都可选），第一项 = 默认值
;  · 不写死区域：默认链最终落在 ♻️ 自动选择（全节点），订阅里只有单个任意地区节点时依然全部可用

;节点池与策略
custom_proxy_group=🚀 主力线路`select`[]♻️ 自动选择`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇭🇰 香港节点`[]🇲🇾 大马节点`[]🏠 住宅节点`[]🌟 手动选择`.*`[]DIRECT
