;设置分组标志位
;基础节点组
;主力线路默认第一项 = 美国优选（url-test 限 US）：首次加载/钉选丢失时不会落到 HK/家宽
custom_proxy_group=🚀 主力线路`select`[]🛟 美国优选`[]♻️ 自动选择`.*`[]DIRECT
custom_proxy_group=🛟 美国优选`url-test`(US|美国)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=⚡ AI 专线`fallback`[]🛟 美国优选`[]🇯🇵 日本节点`[]♻️ 自动选择`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=📥 下载节点`select`(下载|Download)`[]🚀 主力线路`[]♻️ 自动选择`[]🌟 手动选择`[]DIRECT
custom_proxy_group=🏠 住宅节点`select`(住宅|家宽|Home)`[]🚀 主力线路`[]♻️ 自动选择`[]🌟 手动选择`[]DIRECT

;手动选择组
custom_proxy_group=🌟 手动选择`select`[]🚀 主力线路`[]♻️ 自动选择`.*`[]DIRECT
custom_proxy_group=🇯🇵 日本节点`select`(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|[^-]日|JP|Japan)
custom_proxy_group=🎥 奈飞节点`select`(NF|奈飞|解锁|Netflix|NETFLIX|Media)`[]DIRECT

