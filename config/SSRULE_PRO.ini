;设置规则标志位

;设置分组标志位
;通用规范（2026-07-20）：
;  · 区域层 = 固定常用地区集（美/日/港/台/新/韩），不随当前节点增减；无节点的区域组为空，仅作可选项
;  · 场景组 = 变量型引用：主力线路(默认) + 自动选择 + 手动选择 + 具体节点 + DIRECT，不逐个枚举国家
;  · 国家特殊性只保留在场景固有处（奈飞→奈飞节点、巴哈/哔哩/国内媒体→港台、住宅限定→住宅节点）
;  · 区域细分只出现在 主力线路 一层；默认链最终落在 ♻️ 自动选择（全节点），单节点订阅依然全部可用

;节点池与策略（重点选项前置：第1项=自动优选，第2项=手动任选节点，之后才是区域细分）
custom_proxy_group=🚀 主力线路`select`[]♻️ 自动选择`[]🌟 手动选择`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇸🇬 狮城节点`[]🇰🇷 韩国节点`[]🏠 住宅节点`.*`[]DIRECT
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🌟 手动选择`select`[]♻️ 自动选择`.*

;区域层（按命名规范自动归类，url-test 组内选最快；固定集合，不随节点增减）
custom_proxy_group=🇺🇸 美国节点`url-test`(美国|United States|US ·)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本节点`url-test`(日本|东京|大阪|Japan|JP ·)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇭🇰 香港节点`url-test`(香港|Hong ?Kong|HK ·)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇹🇼 台湾节点`url-test`(台湾|台北|新北|彰化|Taiwan|TW ·)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 狮城节点`url-test`(新加坡|狮城|Singapore|SG ·)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇰🇷 韩国节点`url-test`(韩国|首尔|Korea|KR ·)`http://www.gstatic.com/generate_204`300,,50

;属性组
custom_proxy_group=🏠 住宅节点`url-test`(住宅|家宽|Home)`http://www.gstatic.com/generate_204`300,,50
