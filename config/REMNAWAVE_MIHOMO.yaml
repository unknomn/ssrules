# Remnawave MIHOMO subscription template (panel: n.qitt.in, template uuid c9f284c6-ef9c-4743-b34e-bfd1f74a2bce)
# Source of truth is the panel DB; this file is the version-controlled copy.
# Apply via panel UI (Templates -> MIHOMO) or PATCH /api/subscription-templates.

mixed-port: 7890
allow-lan: true
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
# 不设 find-process-mode：面板重序列化会去掉引号，`off` 被 YAML 1.1 解析器（OpenClash 的 Ruby）当成 false → mihomo 报 invalid find process mode；留空走默认 strict。
# 不设 global-client-fingerprint：新版 mihomo 已移除该键（启动即报 error），节点由面板逐个注入 client-fingerprint。
profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.sigy.me"
    - "+.qitt.in"
    - rule-set:cn
    - time.*.com
    - ntp.*.com
    - "+.pool.ntp.org"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  nameserver-policy:
    "rule-set:cn":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "rule-set:geolocation-not-cn":
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query

proxies: # LEAVE THIS LINE!

proxy-groups:
  # ═══════════════════════════════════════════════════════════════════════
  # 通用规范（2026-07-20）：不针对当前节点/国家设计，按固定规范布局
  #   · 顶层顺序：1=🌟 手动选择（唯一需要人操作的入口） 2=🚀 主力线路（策略入口，
  #     默认跟随手动） 3=♻️ 自动选择（全自动，无需操作，靠后）
  #   · 区域层 = 固定常用地区集（美/日/港/台/新/韩），不随当前节点增减；
  #     filter 按命名规范自动归类，url-test 组内选最快；无节点的区域组为空，仅作可选项
  #   · 场景组 = 变量型引用：主力线路(默认) + 手动选择 + 自动选择 + 具体节点(include-all)
  #     + DIRECT，不逐个枚举国家；第一项 = 默认值，客户端改选由 store-selected 持久化
  #   · 国家特殊性只保留在场景固有处（日本媒体→日本节点、哔哩→港台、住宅限定→住宅节点）
  #   · 区域细分只出现在 主力线路 一层；默认链 场景→主力→手动→自动（全节点 url-test），
  #     首项默认只在「从未选过」或「所钉节点消失」时生效，其余时刻保持上次所选
  # ═══════════════════════════════════════════════════════════════════════

  - name: 🌟 手动选择            # 第一位：任选节点的总入口；首项自动兜底（首次加载/所钉节点消失时生效，其余时刻保持上次所选）
    type: select
    proxies:
      - ♻️ 自动选择
    # Remnawave 注入全部节点名（追加于其后）

  - name: 🚀 主力线路            # 第二位：全局默认出口，默认跟随手动选择；区域细分只在这一层
    type: select
    remnawave:
      include-proxies: false
    include-all: true
    proxies:
      - 🌟 手动选择
      - ♻️ 自动选择
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🇭🇰 香港节点
      - 🇹🇼 台湾节点
      - 🇸🇬 狮城节点
      - 🇰🇷 韩国节点
      - 🏠 住宅节点
      - DIRECT

  - name: ♻️ 自动选择            # 全节点池 url-test，全局兜底
    type: url-test
    remnawave:
      include-proxies: false
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🤖 AI                 # 默认主力线路；要钉区域在主力线路层选，要钉节点直接选下方具体节点
    type: select
    remnawave:
      include-proxies: false
    include-all: true
    proxies:
      - 🚀 主力线路
      - 🌟 手动选择
      - ♻️ 自动选择
      - DIRECT

  - name: 🏠 住宅限定            # reddit 等做住宅识别的站点默认走住宅
    type: select
    remnawave:
      include-proxies: false
    include-all: true
    proxies:
      - 🏠 住宅节点
      - 🚀 主力线路
      - 🌟 手动选择
      - ♻️ 自动选择
      - DIRECT

  # ── 区域层：固定常用地区集（不随当前节点增减）；filter 按命名规范自动归类，
  #    url-test 组内选最快（锁区域，区内自愈选优）──
  - name: 🇺🇸 美国节点
    type: url-test
    remnawave:
      include-proxies: false
    include-all: true
    filter: "(?i)(🇺🇸|美国|United States|US ·)"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇯🇵 日本节点
    type: url-test
    remnawave:
      include-proxies: false
    include-all: true
    filter: "(?i)(🇯🇵|日本|东京|大阪|Japan|JP ·)"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇭🇰 香港节点
    type: url-test
    remnawave:
      include-proxies: false
    include-all: true
    filter: "(?i)(🇭🇰|香港|Hong ?Kong|HK ·)"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇹🇼 台湾节点
    type: url-test
    remnawave:
      include-proxies: false
    include-all: true
    filter: "(?i)(🇹🇼|台湾|台北|Taiwan|TW ·)"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇸🇬 狮城节点
    type: url-test
    remnawave:
      include-proxies: false
    include-all: true
    filter: "(?i)(🇸🇬|新加坡|狮城|Singapore|SG ·)"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇰🇷 韩国节点
    type: url-test
    remnawave:
      include-proxies: false
    include-all: true
    filter: "(?i)(🇰🇷|韩国|首尔|Korea|KR ·)"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🏠 住宅节点            # 住宅出口池（zmh01 直连+经HK中转，同一 MY 出口 IP，url-test 选快路径）
    type: url-test
    remnawave:
      include-proxies: false
    include-all: true
    filter: "(?i)(家宽|住宅|residential)"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # ── 场景层：变量型引用（主力/手动/自动 + include-all 具体节点），第一项 = 默认 ──
  - name: 📲 电报消息
    type: select
    remnawave:
      include-proxies: false
    include-all: true
    proxies:
      - 🚀 主力线路
      - 🌟 手动选择
      - ♻️ 自动选择
      - DIRECT

  - name: 📹 油管视频
    type: select
    remnawave:
      include-proxies: false
    include-all: true
    proxies:
      - 🚀 主力线路
      - 🌟 手动选择
      - ♻️ 自动选择
      - DIRECT

  - name: 🎥 奈飞视频
    type: select
    remnawave:
      include-proxies: false
    include-all: true
    proxies:
      - 🚀 主力线路
      - 🌟 手动选择
      - ♻️ 自动选择
      - DIRECT

  - name: 🌍 国外媒体
    type: select
    remnawave:
      include-proxies: false
    include-all: true
    proxies:
      - 🚀 主力线路
      - 🌟 手动选择
      - ♻️ 自动选择
      - DIRECT

  - name: 🎌 日本媒体            # 日本地域限定（DMM/niconico/ABEMA/TVer/radiko）→ 场景固有：默认日本节点
    type: select
    remnawave:
      include-proxies: false
    include-all: true
    proxies:
      - 🇯🇵 日本节点
      - 🚀 主力线路
      - 🌟 手动选择
      - ♻️ 自动选择
      - DIRECT

  - name: Ⓜ️ 微软服务
    type: select
    remnawave:
      include-proxies: false
    proxies:
      - DIRECT
      - 🚀 主力线路
      - 🌟 手动选择
      - ♻️ 自动选择

  - name: 🍎 苹果服务
    type: select
    remnawave:
      include-proxies: false
    proxies:
      - DIRECT
      - 🚀 主力线路
      - 🌟 手动选择
      - ♻️ 自动选择

  - name: 📺 哔哩哔哩            # 港澳台限定内容 → 场景固有：可切港/台
    type: select
    remnawave:
      include-proxies: false
    proxies:
      - DIRECT
      - 🚀 主力线路
      - 🇭🇰 香港节点
      - 🇹🇼 台湾节点

  - name: 🎯 全球直连
    type: select
    remnawave:
      include-proxies: false
    proxies:
      - DIRECT
      - 🚀 主力线路

  - name: 🛑 广告拦截
    type: select
    remnawave:
      include-proxies: false
    proxies:
      - REJECT
      - DIRECT

  - name: 🐟 漏网之鱼
    type: select
    remnawave:
      include-proxies: false
    include-all: true
    proxies:
      - 🚀 主力线路
      - 🌟 手动选择
      - ♻️ 自动选择
      - DIRECT

