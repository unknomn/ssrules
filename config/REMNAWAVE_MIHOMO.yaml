# Remnawave MIHOMO subscription template (panel: n.qitt.in, template uuid c9f284c6-ef9c-4743-b34e-bfd1f74a2bce)
# Source of truth is the panel DB; this file is the version-controlled copy.
# Apply via panel UI (Templates -> MIHOMO) or PATCH /api/subscription-templates.

mixed-port: 7890
allow-lan: true
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: 'off'
global-client-fingerprint: chrome
profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.sigy.me"
    - "+.qitt.in"
    - rule-set:cn
    - time.*.com
    - ntp.*.com
    - "+.pool.ntp.org"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  nameserver-policy:
    "rule-set:cn":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "rule-set:geolocation-not-cn":
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query

proxies: # LEAVE THIS LINE!

proxy-groups:
  # ═══════════════════════════════════════════════════════════════════════
  # 策略层：唯一需要人工表达"意见"的地方
  #   · 默认区域优先级 → 调整各策略组 proxies 顺序（第一项 = 默认出口）
  #   · AI 可用区      → 调整 🤖 AI 的 fallback 链
  # 下方区域层/场景层是 filter 驱动、自维护：新增节点只要命名含国别标识即自动归位，
  # 不需要改本模板。
  # ═══════════════════════════════════════════════════════════════════════

  - name: 🚀 主力线路            # 全局默认出口（未被规则分流的流量都走这里）
    type: select
    remnawave:
      include-proxies: false
    proxies:
      - 🇺🇸 美国节点             # 默认：美国（组内 url-test 自动选最快的美国节点）
      - 🇯🇵 日本节点
      - 🇭🇰 香港节点
      - 🏠 住宅节点
      - 🌟 手动选择
      - DIRECT

  - name: 🤖 AI                 # 国别优先 US>JP；HK 被封锁、住宅慢且地域不一致 → 不入链
    type: fallback              # 按序回退：美国活着就用美国(组内选最快)，全挂才退日本
    remnawave:
      include-proxies: false
    proxies:
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
    url: https://www.gstatic.com/generate_204
    interval: 300

  - name: 🏠 住宅限定            # 质量优先：reddit 等做住宅识别的站点走住宅，掉线退美国
    type: select
    remnawave:
      include-proxies: false
    proxies:
      - 🏠 住宅节点
      - 🇺🇸 美国节点
      - 🌟 手动选择

  # ── 区域层：filter 自动归类 + url-test 组内选最快（锁区域，区内自愈选优）──
  - name: 🇺🇸 美国节点
    type: url-test
    remnawave:
      include-proxies: false
    include-all: true
    filter: "(?i)(🇺🇸|美国|US ·)"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇯🇵 日本节点
    type: url-test
    remnawave:
      include-proxies: false
    include-all: true
    filter: "(?i)(🇯🇵|日本|JP ·)"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇭🇰 香港节点
    type: url-test
    remnawave:
      include-proxies: false
    include-all: true
    filter: "(?i)(🇭🇰|香港|HK ·)"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🏠 住宅节点            # 住宅出口池（zmh01 直连+经HK中转，同一 MY 出口 IP，url-test 选快路径）
    type: url-test
    remnawave:
      include-proxies: false
    include-all: true
    filter: "(?i)(家宽|住宅|residential)"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🌟 手动选择            # 全节点手动池（需要钉死某台具体节点时用）
    type: select
    # Remnawave 注入全部节点名

  # ── 场景层：按用途引用区域/策略组（静态引用，换节点无需改）──
  - name: 📲 电报消息
    type: select
    remnawave:
      include-proxies: false
    proxies:
      - 🚀 主力线路
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🌟 手动选择
      - DIRECT

  - name: 📹 油管视频
    type: select
    remnawave:
      include-proxies: false
    proxies:
      - 🚀 主力线路
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🌟 手动选择
      - DIRECT

  - name: 🎥 奈飞视频
    type: select
    remnawave:
      include-proxies: false
    proxies:
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🚀 主力线路
      - 🌟 手动选择

  - name: 🌍 国外媒体
    type: select
    remnawave:
      include-proxies: false
    proxies:
      - 🚀 主力线路
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🌟 手动选择
      - DIRECT

  - name: 🎌 日本媒体            # 日本地域限定（DMM/niconico/ABEMA/TVer/radiko）→ 必须日本 IP
    type: select
    remnawave:
      include-proxies: false
    proxies:
      - 🇯🇵 日本节点
      - 🌟 手动选择

  - name: Ⓜ️ 微软服务
    type: select
    remnawave:
      include-proxies: false
    proxies:
      - DIRECT
      - 🚀 主力线路
      - 🌟 手动选择

  - name: 🍎 苹果服务
    type: select
    remnawave:
      include-proxies: false
    proxies:
      - DIRECT
      - 🚀 主力线路
      - 🌟 手动选择

  - name: 📺 哔哩哔哩
    type: select
    remnawave:
      include-proxies: false
    proxies:
      - DIRECT
      - 🚀 主力线路

  - name: 🎯 全球直连
    type: select
    remnawave:
      include-proxies: false
    proxies:
      - DIRECT
      - 🚀 主力线路

  - name: 🛑 广告拦截
    type: select
    remnawave:
      include-proxies: false
    proxies:
      - REJECT
      - DIRECT

  - name: 🐟 漏网之鱼
    type: select
    remnawave:
      include-proxies: false
    proxies:
      - 🚀 主力线路
      - 🇺🇸 美国节点
      - 🌟 手动选择
      - DIRECT

